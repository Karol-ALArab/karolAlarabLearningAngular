<div *ngIf="item" class="item-content">
  <img
    *ngIf="item.image"
    [ngSrc]="item.image"
    [alt]="item.name"
    width="300"
    height="300"
    class="item-image"
  />

  <div class="item-details">
    <h2>{{ item.name }}</h2>
    <p><strong>Category:</strong> {{ item.category }}</p>
    <p><strong>Price:</strong> ${{ item.price }}</p>
    <p><strong>Description:</strong> {{ item.description }}</p>
  </div>
</div>
