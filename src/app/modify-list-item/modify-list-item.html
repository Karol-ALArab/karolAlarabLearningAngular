<form [formGroup]="itemForm" (ngSubmit)="onSubmit()">

  <mat-form-field appearance="fill">
    <mat-label>ID</mat-label>
    <input matInput type="number" formControlName="id" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" required appHighlightOn="lightblue" matTooltip="Enter equipment name" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Price</mat-label>
    <input matInput type="number" formControlName="price" required appHighlightOn="lightblue" matTooltip="Enter price" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Category</mat-label>
    <input matInput formControlName="category" appHighlightOn="lightblue" matTooltip="Enter category" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Description</mat-label>
    <input matInput formControlName="description" appHighlightOn="lightblue" matTooltip="Enter description" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Image</mat-label>
    <input matInput formControlName="image" appHighlightOn="lightblue" matTooltip="Enter image URL" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Added On</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="dateAdded" matTooltip="Select date">
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <button mat-raised-button type="submit">Submit</button>
  <button mat-raised-button type="button" (click)="onDelete()">Delete</button>
  <button mat-raised-button type="button" (click)="navBackToEquipmentList()">Back to Equipment List</button>

</form>

<p *ngIf="error">{{ error }}</p>
