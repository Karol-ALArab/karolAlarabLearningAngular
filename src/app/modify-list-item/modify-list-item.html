<form [formGroup]="itemForm" (ngSubmit)="onSubmit()">

  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" formControlName="name" required />
  </div>

  <div class="form-group">
    <label for="price">Price</label>
    <input type="number" id="price" formControlName="price" required />
  </div>

  <div class="form-group">
    <label for="category">Category</label>
    <input type="text" id="category" formControlName="category" />
  </div>

  <div class="form-group">
    <label for="description">Description</label>
    <input type="text" id="description" formControlName="description" />
  </div>

  <button type="submit">Submit</button>
  <button type="button" (click)="onDelete()">Delete</button>
  <button type="button" (click)="navBackToEquipmentList()">Back to Equipment List</button>
</form>

<p *ngIf="error">{{ error }}</p>
